<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup — OCR 語言選擇彈窗</title>
<style>
:root{
  --paper:#FBFAF7; --ink:#181B20; --muted:#6B7178;
  --line:#E7E3DA; --accent:#2E4B8F; --accent-soft:#EAEEF7;
  --ok:#1F7A54; --err:#B03A2E; --warn:#B8860B;
  --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
.mock-topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;}
.wordmark{font-family:var(--serif);font-size:19px;}
.wordmark .dot{color:var(--accent);}
.crumb{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;}
.crumb b{color:var(--accent);}
.badge-row{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.badge{border:1px solid var(--line);border-radius:5px;padding:2px 8px;}
.badge.go{color:var(--accent);border-color:var(--accent);}
.wire-banner{background:var(--accent-soft);border-bottom:1px solid var(--line);padding:8px 22px;font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.05em;}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:7px 14px;font-size:12.5px;background:var(--paper);color:var(--ink);cursor:pointer;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
footer.mock-foot{padding:10px 22px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
a.back{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:11px;}

.stage{height:640px;background:#EFEDE6;position:relative;display:flex;align-items:center;justify-content:center;}
.modal{width:380px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.18);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;}
.modal-body{padding:16px 18px;}
.hint{font-size:12px;color:var(--muted);margin:0 0 12px;}
.opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px;font-size:13px;}
.opt.checked{border-color:var(--accent);background:var(--accent-soft);}
.note{background:var(--accent-soft);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:11px;color:var(--ink);margin-top:8px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--line);}
</style>
</head>
<body>
  <div class="mock-topbar">
    <div class="wordmark">ImageViewerOCR<span class="dot">.</span></div>
    <div class="crumb">前台 · <b>OCR 語言選擇彈窗</b>（步驟 2／3）</div>
    <div class="badge-row"><span class="badge go">▸ mockup</span><span class="badge">index.html #ocr-lang-modal</span></div>
  </div>
  <div class="wire-banner">MOCKUP — 線框稿。框選文字區域後彈出，勾選語言（可複選）後開始辨識；資料來源：index.html #ocr-lang-modal</div>

  <div class="stage card">
    <div class="modal">
      <div class="modal-head"><span>🌐 選擇辨識語言</span><span style="color:var(--muted);cursor:pointer;">✕</span></div>
      <div class="modal-body">
        <p class="hint">請勾選要辨識的語言，然後點擊「開始辨識」</p>
        <div class="opt checked">☑ 繁體中文</div>
        <div class="opt">☐ 簡體中文</div>
        <div class="opt">☐ 日文（含漢字）</div>
        <div class="opt">☐ 韓文</div>
        <div class="opt checked">☑ 英文</div>
        <div class="note">💡 提示：選擇較少的語言可提高辨識準確度</div>
      </div>
      <div class="modal-foot">
        <button class="btn">取消</button>
        <button class="btn primary">🔍 開始辨識</button>
      </div>
    </div>
  </div>

  <footer class="mock-foot">
    <span>image-viewer-ocr / mockup / front-ocr-language.html</span>
    <a class="back" href="index.html">← 回總覽</a>
  </footer>
</body>
</html>
